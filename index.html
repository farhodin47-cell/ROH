<!doctype html>
<html lang="tg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Таксии байни ноҳияҳо</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0B4BD1">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script defer src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
:root{--b:#0B4BD1;--y:#FFC21A;--ink:#0F1B3D;--mut:#5B6470;--bg:#F3F6FD;--line:#D5DCEA}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,Roboto,sans-serif;background:var(--bg);color:var(--ink);padding-bottom:84px}
header{position:relative;overflow:hidden;color:#fff;height:238px;background:linear-gradient(#0A3FBF,#2F6FE0 70%,#8DB6F2)}
header.bar{height:56px;background:var(--b)}
.hd{position:absolute;top:22px;left:18px;right:18px}
header.bar .hd{top:15px}
h1{margin:0;font-size:27px;line-height:1.1;font-weight:800}
h1 span{color:var(--y)}
header.bar h1{font-size:19px}
header.bar br,header.bar .tag,header.bar svg{display:none}
.tag{margin-top:8px;font-size:15px;font-style:italic}
header svg{position:absolute;left:0;bottom:0;width:100%;height:auto}
h2{font-size:17px;margin:20px 2px 10px}
main{padding:14px 14px 16px}
.card,.trip{background:#fff;border-radius:18px;padding:16px;margin-bottom:12px;box-shadow:0 1px 3px rgba(15,27,61,.08)}
.sc{margin-top:-38px;position:relative;box-shadow:0 4px 16px rgba(11,75,209,.16)}
label{display:block;font-size:13px;font-weight:600;color:var(--mut);margin:10px 0 4px}
select,input{width:100%;height:48px;border:1px solid var(--line);border-radius:12px;padding:0 12px;font-size:16px;background:#fff;color:var(--ink)}
input[type=file]{height:auto;padding:10px}
button,.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:48px;margin-top:12px;border:0;border-radius:24px;background:var(--b);color:#fff;font-size:16px;font-weight:700;text-decoration:none;font-family:inherit}
button.ghost{background:#fff;color:var(--b);border:1.5px solid var(--b)}
button.big{background:#fff;color:var(--ink);border:2px solid var(--b);border-radius:20px;padding:18px;font-size:20px;flex-direction:column;gap:2px}
button.big.y{border-color:var(--y)}
button.big small{font-weight:400;color:var(--mut);font-size:14px}
button.red{background:#C62828}
.sr{display:flex;gap:8px;align-items:center}.sr .col{flex:1}
button.sw{width:46px;height:46px;min-height:0;margin:0;padding:0;border-radius:23px;background:#E3EBFB;flex:none}
.qs{display:grid;grid-template-columns:1fr 1fr;gap:8px}
button.q{margin:0;min-height:52px;border-radius:14px;background:#E3EBFB;color:var(--ink);border:1px solid #C9D6F3;font-size:14px;font-weight:600;padding:6px 10px}
.tt{display:flex;justify-content:space-between;align-items:flex-start}
.tm{font-size:28px;font-weight:800;line-height:1}
.dy{font-size:13px;color:var(--mut);margin-top:4px}
.pr{font-size:24px;font-weight:800;color:var(--b)}.pr small{font-size:13px;font-weight:600;color:var(--mut)}
.dr{display:flex;align-items:center;gap:12px;margin:14px 0 12px}
.av{width:48px;height:48px;border-radius:24px;background:var(--b);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:18px;flex:none;object-fit:cover}
.mut{color:var(--mut);font-size:14px}
.pl{display:inline-block;background:#FFF1CC;color:#6B4A00;border-radius:6px;padding:1px 7px;font-weight:700;font-size:13px}
.st{display:flex;align-items:center;gap:6px;font-size:14px;font-weight:600}
.st i{width:16px;height:16px;border-radius:5px;border:2px solid var(--b);display:inline-block}.st i.f{background:var(--b)}.st span{margin-left:6px}
.empty{text-align:center;padding:26px 10px;color:var(--mut)}
.empty b{display:block;color:var(--ink);font-size:17px;margin:10px 0 4px}
.badge{display:inline-block;border-radius:12px;padding:3px 10px;font-size:13px;font-weight:700;background:#E3EBFB;color:var(--b);margin-right:6px}
.badge.y{background:#FFF1CC;color:#6B4A00}.badge.ok{background:#DDF3E6;color:#14733E}
.onl{color:#14733E;font-weight:700;font-size:13px}
.l2{display:block;text-align:center;margin-top:10px;color:var(--b);font-weight:600;font-size:14px}
.pv{display:none;width:96px;height:96px;object-fit:cover;border-radius:12px;margin-top:8px}
#map{height:calc(100vh - 220px);min-height:320px;border-radius:16px;overflow:hidden}
.mk{width:34px;height:34px;border-radius:17px;background:#0B4BD1;border:3px solid #fff;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 6px rgba(0,0,0,.3)}
nav{position:fixed;left:0;right:0;bottom:0;z-index:2000;display:flex;background:#fff;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav button{margin:0;border-radius:0;background:#fff;color:var(--mut);min-height:62px;flex-direction:column;gap:2px;font-size:12px;font-weight:600}
nav button.on{color:var(--b);box-shadow:inset 0 3px 0 var(--b)}
nav button svg{stroke:currentColor}
</style>
</head>
<body>
<header id="hd"><div class="hd"><h1>Таксии <br><span>байни ноҳияҳо</span></h1><div class="tag">Сафари осон, беҳтар ва зуд!</div></div>
<svg viewBox="0 0 390 120" aria-hidden="true"><polygon points="0,62 55,28 95,48 165,8 235,50 300,22 390,56 390,120 0,120" fill="#7C9BC9"/><polygon points="165,8 150,26 162,23 170,31 182,20" fill="#fff"/><polygon points="300,22 288,35 297,32 306,38" fill="#fff"/><path d="M0 70 Q95 52 195 72 T390 64 V120 H0Z" fill="#4F8F4D"/><polygon points="0,88 390,76 390,98 0,110" fill="#4A5160"/><line x1="0" y1="99" x2="390" y2="87" stroke="#FFC21A" stroke-width="2" stroke-dasharray="14 12"/><polygon points="0,110 390,98 390,120 0,120" fill="#3F7A40"/><rect x="246" y="66" width="124" height="22" rx="9" fill="#fff"/><path d="M268 66l15-16h42l16 16z" fill="#fff"/><path d="M277 65l11-11h34l11 11z" fill="#2B3A55"/><circle cx="276" cy="88" r="9" fill="#1B2230"/><circle cx="350" cy="88" r="9" fill="#1B2230"/></svg></header>
<main id="app"></main>
<nav>
<button data-t="home" onclick="go('home')"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>Асосӣ</button>
<button data-t="map" onclick="go('map')"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>Харита</button>
<button data-t="post" onclick="go('post')"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>Эълон</button>
<button data-t="me" onclick="go('me')"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>Профил</button>
</nav>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import{getFirestore,collection,addDoc,deleteDoc,doc,setDoc,onSnapshot}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const app=initializeApp({
apiKey:"AIzaSyBZUDW6O-VnJp5ZZJMbOJxGpYV0DB4NEkY",
authDomain:"taxi-roh.firebaseapp.com",
projectId:"taxi-roh",
storageBucket:"taxi-roh.firebasestorage.app",
messagingSenderId:"96810728626",
appId:"1:96810728626:web:eb5ba19098910216ea9dab"
});
const db=getFirestore(app);
const R={
"Душанбе":["Душанбе"],
"Вилояти Суғд":["Хуҷанд","Конибодом","Исфара","Истаравшан","Панҷакент","Истиқлол","Гулистон","Бустон","Мастчоҳ","Бобоҷон Ғафуров","Ашт","Зафаробод","Спитамен","Ҷаббор Расулов","Шаҳристон","Деваштич","Айнӣ","Кӯҳистони Мастчоҳ"],
"Вилояти Хатлон":["Бохтар","Кӯлоб","Норак","Левакант","Хуросон","Ёвон","Балҷувон","Ховалинг","Абдураҳмони Ҷомӣ","Данғара","Темурмалик","Мӯминобод","Кӯшониён","Вахш","Восеъ","Шамсиддин Шоҳин","Носири Хусрав","Шаҳритус","Қубодиён","Дӯстӣ","Ҷайҳун","Ҷалолиддин Балхӣ","Фархор","Панҷ","Ҳамадонӣ"],
"Кӯҳистони Бадахшон":["Хоруғ","Дарвоз","Ванҷ","Рӯшон","Шуғнон","Роштқалъа","Ишкошим","Мурғоб"],
"Ноҳияҳои тобеи ҷумҳурӣ":["Ҳисор","Турсунзода","Ваҳдат","Роғун","Шаҳринав","Варзоб","Рашт","Лахш","Рӯдакӣ","Файзобод","Нуробод","Тоҷикобод","Сангвор"]
};
const PH='<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg>';
const SWAP='<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#0B4BD1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 4v16M3 8l4-4 4 4M17 20V4M13 16l4 4 4-4"/></svg>';
const CAR='<svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="#9AA6C0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 17h14v-5l-2-5H7l-2 5zM3 12h18M7 17v2M17 17v2"/></svg>';
const CARW='<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 17h14v-5l-2-5H7l-2 5zM3 12h18"/></svg>';
function load(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}}
function save(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
const S={user:load('user'),trips:[],drivers:{},live:{},err:'',loaded:false,tab:'home',role:null,f:'Данғара',t:'Душанбе',tmp:{},sharing:false,focus:null,map:null,layer:null};
function $(id){return document.getElementById(id)}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function dig(p){return String(p||'').replace(/\D/g,'').replace(/^992/,'')}
function ph(v){let d=dig(v);if(d.length===10&&d[0]==='0')d=d.slice(1);return d.length===9?d:''}
function tl(p){const d=dig(p);return d[0]==='0'?d:'+992'+d}
function fmt(p){const d=dig(p);return d.length===9?'+992 '+d.slice(0,2)+' '+d.slice(2,5)+' '+d.slice(5,7)+' '+d.slice(7):String(p||'')}
function did(u){return dig(u&&u.phone)}
function safeImg(s){return typeof s==='string'&&s.startsWith('data:image/jpeg;base64,')&&!/["'<>\s]/.test(s)?s:''}
function ago(t){const m=Math.round((Date.now()-t)/60000);return m<1?'ҳозир':m+' дақиқа пеш'}
function opts(sel){let h='';for(const g in R){h+='<optgroup label="'+g+'">'+R[g].map(p=>'<option'+(p===sel?' selected':'')+'>'+p+'</option>').join('')+'</optgroup>'}return h}
function fresh(){return S.trips.filter(x=>Date.now()-(x.created||0)<129600000)}
function liveList(){return Object.values(S.live).filter(x=>Date.now()-x.t<600000)}
function isOn(id){const l=S.live[id];return !!l&&Date.now()-l.t<600000}
function seats(n){n=Math.max(0,parseInt(n)||0);const t=Math.max(4,n);let h='';for(let i=0;i<t;i++)h+='<i class="'+(i<n?'f':'')+'"></i>';return h}
function avatar(d,name,sz){const im=safeImg(d&&d.photo),st=sz?`style="width:${sz}px;height:${sz}px;border-radius:${sz/2}px;font-size:${sz/2}px"`:'';return im?`<img class="av" ${st} src="${im}" alt="">`:`<span class="av" ${st}>${esc((name||'?').trim().charAt(0).toUpperCase())}</span>`}
function card(x){
const d=S.drivers[x.did]||{},name=d.name||x.name,on=isOn(x.did);
const info=d.age?`${esc(d.age)} сола${d.from?' · аз '+esc(d.from):''}`:'';
return `<div class="trip"><div class="tt"><div><div class="tm">${esc(x.time)}</div><div class="dy">${esc(x.day)}</div></div><div class="pr">${esc(x.price)}<small> сомонӣ</small></div></div><div class="dr">${avatar(d,name)}<div><b>${esc(name)}</b>${d.verified?' <span class="badge ok">Санҷида шуд</span>':''}<div class="mut">${info?info+'<br>':''}${esc(x.car)} · <span class="pl">${esc(x.plate)}</span></div>${on?'<div class="onl">● Дар роҳ, онлайн</div>':''}</div></div><div class="st">${seats(x.seats)}<span>${esc(x.seats)} ҷои холӣ</span></div><a class="btn" href="tel:${esc(tl(x.phone))}">${PH} Занг задан</a>${d.phone2?`<a class="l2" href="tel:${esc(tl(d.phone2))}">Рақами дуюм: ${esc(fmt(d.phone2))}</a>`:''}${on?`<button class="ghost" onclick="showOnMap('${esc(x.did)}')">Дар харита дидан</button>`:''}</div>`}
function empty(t,s){return `<div class="empty">${CAR}<b>${t}</b>${s}</div>`}
function home(){
const list=fresh().filter(x=>x.from===S.f&&x.to===S.t).sort((a,b)=>(a.day+a.time<b.day+b.time?-1:1));
const q=[['Душанбе','Хуҷанд'],['Хуҷанд','Душанбе'],['Душанбе','Бохтар'],['Бохтар','Душанбе'],['Данғара','Душанбе'],['Душанбе','Данғара']];
let body;
if(S.err)body=`<p class="mut">${S.err}</p>`;
else if(!S.loaded)body=empty('Боргирӣ…','');
else body=list.length?list.map(card).join(''):empty('Ҳоло мошин нест','Ронандагон дар бахши «Эълон» сафар илова мекунанд.');
return `<div class="card sc"><div class="sr"><div class="col"><label>Аз</label><select id="f">${opts(S.f)}</select><label>Ба</label><select id="t">${opts(S.t)}</select></div><button class="sw" aria-label="Иваз кардан" onclick="swap()">${SWAP}</button></div><button onclick="search()">Ҷустуҷӯ кардан</button></div><h2>Роҳҳои маъмул</h2><div class="qs">${q.map(p=>`<button class="q" onclick="quick('${p[0]}','${p[1]}')">${p[0]} → ${p[1]}</button>`).join('')}</div><h2>Мошинҳо: ${esc(S.f)} → ${esc(S.t)}</h2>`+body}
function quick(a,b){S.f=a;S.t=b;render()}
function search(){S.f=$('f').value;S.t=$('t').value;render()}
function swap(){const a=$('f').value,b=$('t').value;S.f=b;S.t=a;render()}
function mapView(){return `<div class="mut" style="margin:0 2px 8px">Ронандагони онлайн: <b id="cnt">${liveList().length}</b></div><div id="map"></div>`}
function drawMap(){
const el=$('map');if(!el)return;
if(!window.L){el.innerHTML=empty('Харита боргирӣ нашуд','Интернетро санҷед ва саҳифаро нав кунед.');return}
S.map=L.map('map').setView([38.6,70.8],7);
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:18,attribution:'© OpenStreetMap'}).addTo(S.map);
S.layer=L.layerGroup().addTo(S.map);markers()}
function markers(){
if(!S.map)return;S.layer.clearLayers();let fm=null;
liveList().forEach(x=>{
const d=S.drivers[x.did]||{};
const ic=L.divIcon({className:'',html:'<div class="mk">'+CARW+'</div>',iconSize:[34,34],iconAnchor:[17,17]});
const m=L.marker([x.lat,x.lng],{icon:ic}).addTo(S.layer);
m.bindPopup(`<b>${esc(x.name)}</b><br>${esc(d.car||'')} ${esc(d.plate||'')}<br>${x.from?esc(x.from)+' → '+esc(x.to)+'<br>':''}Охирин навсозӣ: ${ago(x.t)}<br><a href="tel:${esc(tl(d.phone||''))}">Занг задан</a>`);
if(S.focus===x.did)fm=m});
if(fm){S.map.setView(fm.getLatLng(),12);fm.openPopup();S.focus=null}}
function showOnMap(id){S.focus=id;go('map')}
function mineHtml(){
const mine=fresh().filter(x=>x.did===did(S.user)||x.phone===S.user.phone);
return mine.length?mine.map(x=>`<div class="trip"><div class="tt"><div><div class="tm" style="font-size:20px">${esc(x.from)} → ${esc(x.to)}</div><div class="dy">${esc(x.day)} · ${esc(x.time)} · ${esc(x.seats)} ҷои холӣ</div></div><div class="pr" style="font-size:20px">${esc(x.price)}</div></div><button class="ghost" onclick="delTrip('${x.id}')">Мошин пур шуд / Бекор кардан</button></div>`).join(''):empty('Эълон нест','Сафари нав илова кунед.')}
function post(){
if(!S.user||S.user.role!=='driver')return `<div class="card"><h2 style="margin-top:0">Эълони сафар</h2><p class="mut">Барои эълон кардани сафар аввал ҳамчун ронанда қайд шавед.</p><button onclick="go('me')">Қайд шудан</button></div>`;
return `<div class="card"><h2 style="margin-top:0">Мавқеи ман дар харита</h2><p class="mut">Мусофирон мебинанд, ки шумо дар куҷо ҳастед. Мавқеъ танҳо вақте нав мешавад, ки барнома кушода ва экран фаъол аст.</p>${S.sharing?'<div class="onl">● Мавқеъ нишон дода мешавад</div><button class="red" onclick="stopShare()">Қатъ кардан</button>':'<button onclick="startShare()">Мавқеъро нишон додан</button>'}</div><div class="card"><h2 style="margin-top:0">Сафари нав</h2><label>Аз</label><select id="pf">${opts('Данғара')}</select><label>Ба</label><select id="pt">${opts('Душанбе')}</select><label>Рӯз</label><select id="pd"><option>Имрӯз</option><option>Фардо</option></select><label>Вақти ҳаракат</label><input id="pm" type="time"><label>Ҷойҳои холӣ</label><input id="ps" type="number" min="1" max="8" value="3"><label>Нарх (сомонӣ)</label><input id="pp" type="number" min="0"><button onclick="addTrip()">Эълон кардан</button></div><h2>Эълонҳои ман</h2><div id="mine">${mineHtml()}</div>`}
async function addTrip(){
const m=$('pm').value,p=$('pp').value,a=$('pf').value,b=$('pt').value;
if(!m||!p){alert('Вақт ва нархро нависед');return}
if(a===b){alert('Самти «аз» ва «ба» набояд яксон бошад');return}
try{await addDoc(collection(db,'trips'),{from:a,to:b,day:$('pd').value,time:m,seats:$('ps').value,price:p,name:S.user.name,car:S.user.car,plate:S.user.plate,phone:S.user.phone,did:did(S.user),created:Date.now()});$('pm').value='';$('pp').value=''}catch(e){alert('Эълон нашуд. Интернет ва қоидаҳои базаро санҷед.')}}
async function delTrip(id){try{await deleteDoc(doc(db,'trips',id))}catch(e){alert('Нашуд. Боз кӯшиш кунед.')}}
let wid=null,lastW=0,lock=null;
async function startShare(){
if(!navigator.geolocation){alert('Телефони шумо мавқеъро намедиҳад');return}
S.sharing=true;lastW=0;
try{lock=await navigator.wakeLock.request('screen')}catch(e){}
wid=navigator.geolocation.watchPosition(pos=>{
const now=Date.now();if(now-lastW<10000)return;lastW=now;
const my=fresh().filter(x=>x.did===did(S.user)).sort((a,b)=>b.created-a.created)[0]||{};
setDoc(doc(db,'live',did(S.user)),{lat:pos.coords.latitude,lng:pos.coords.longitude,t:now,name:S.user.name,did:did(S.user),from:my.from||'',to:my.to||''}).catch(()=>{})},
()=>{alert('Мавқеъ гирифта нашуд. Дар танзимоти телефон иҷозати мавқеъро диҳед.');stopShare()},
{enableHighAccuracy:true,maximumAge:5000,timeout:20000});
render()}
function stopShare(){
S.sharing=false;if(wid!=null&&navigator.geolocation)navigator.geolocation.clearWatch(wid);wid=null;
try{lock&&lock.release()}catch(e){}lock=null;
if(S.user)deleteDoc(doc(db,'live',did(S.user))).catch(()=>{});
render()}
function me(){
if(S.user){const u=S.user,d=u.role==='driver',pd=S.drivers[did(u)]||u;
return `<div class="card"><div class="dr" style="margin-top:0">${avatar(pd,u.name,64)}<div><b style="font-size:19px">${esc(u.name)}</b><div style="margin-top:4px"><span class="badge${d?' y':''}">${d?'Ронанда':'Муштарӣ'}</span>${d&&pd.verified?'<span class="badge ok">Санҷида шуд</span>':''}</div></div></div><div class="mut">Телефон</div><div style="font-size:17px;font-weight:600;margin-bottom:10px">${esc(fmt(u.phone))}${pd.phone2?'<br>'+esc(fmt(pd.phone2)):''}</div>${d&&pd.age?`<div class="mut">Синну сол · аз куҷо</div><div style="font-size:17px;font-weight:600;margin-bottom:10px">${esc(pd.age)} сола · ${esc(pd.from)}</div>`:''}${d?`<div class="mut">Мошин</div><div style="font-size:17px;font-weight:600">${esc(u.car)} <span class="pl">${esc(u.plate)}</span></div>${pd.verified?'':'<p class="mut">Шиноснома пас аз санҷиш тасдиқ мешавад.</p>'}`:''}<button class="ghost" onclick="logout()">Баромадан</button></div>`}
if(!S.role)return `<h2 style="margin-top:0">Шумо кистед?</h2><button class="big" onclick="pick('customer')">Муштарӣ<small>Ман такси мехоҳам</small></button><button class="big y" onclick="pick('driver')">Ронанда (такси)<small>Ман мусофир мебарам</small></button>`;
const d=S.role==='driver';
return `<div class="card"><h2 style="margin-top:0">${d?'Қайди ронанда':'Қайди муштарӣ'}</h2>${d?`<label>Акси шумо (рӯй)</label><input id="ph" type="file" accept="image/*" onchange="pickFile('photo',this)"><img id="pv_photo" class="pv" alt="">`:''}<label>Ном ва насаб</label><input id="rn">${d?`<label>Синну сол</label><input id="ra" type="number" inputmode="numeric" min="18" max="75" placeholder="35"><label>Аз куҷо ҳастед</label><select id="rf">${opts('Данғара')}</select>`:''}<label>Рақами телефон (+992)</label><input id="rp" type="tel" inputmode="numeric" placeholder="92 123 45 67">${d?`<label>Рақами дуюм (ихтиёрӣ)</label><input id="rp2" type="tel" inputmode="numeric" placeholder="90 123 45 67"><label>Мошин (марка)</label><input id="rc"><label>Рақами давлатии мошин</label><input id="rl"><label>Акси шиноснома (права)</label><input id="lc" type="file" accept="image/*" onchange="pickFile('lic',this)"><p class="mut" style="margin:4px 0 0">Танҳо барои санҷиш. Ба мусофирон нишон дода намешавад.</p><img id="pv_lic" class="pv" alt="">`:''}<button onclick="reg()">Қайд шудан</button><p class="mut">Тасдиқи рамзи СМС баъдтар илова мешавад.</p><button class="ghost" onclick="pick(null)">Бозгашт</button></div>`}
function img(file,max,q){return new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>{const i=new Image();i.onload=()=>{const k=Math.min(1,max/Math.max(i.width,i.height));const c=document.createElement('canvas');c.width=Math.round(i.width*k);c.height=Math.round(i.height*k);c.getContext('2d').drawImage(i,0,0,c.width,c.height);ok(c.toDataURL('image/jpeg',q))};i.onerror=no;i.src=r.result};r.onerror=no;r.readAsDataURL(file)})}
async function pickFile(kind,inp){
const f=inp.files&&inp.files[0];if(!f)return;
try{S.tmp[kind]=await img(f,kind==='lic'?900:220,kind==='lic'?0.7:0.6);const p=$('pv_'+kind);if(p){p.src=S.tmp[kind];p.style.display='block'}}catch(e){alert('Акс кушода нашуд. Акси дигар интихоб кунед.')}}
function pick(r){S.role=r;S.tmp={};render()}
async function reg(){
const n=$('rn').value.trim(),p=ph($('rp').value);
if(!n||!p){alert('Ном ва рақами телефонро дуруст нависед: 9 рақам, масалан 921234567');return}
const u={role:S.role,name:n,phone:'+992'+p};
if(S.role==='driver'){
const age=parseInt($('ra').value),from=$('rf').value,v2=$('rp2').value.trim(),p2=v2?ph(v2):'';
const car=$('rc').value.trim(),plate=$('rl').value.trim();
if(!(age>=18&&age<=75)){alert('Синну солро дуруст нависед (аз 18 то 75)');return}
if(v2&&!p2){alert('Рақами дуюм нодуруст аст');return}
if(!car||!plate){alert('Мошин ва рақамро нависед');return}
const ex=S.drivers[p];
if(ex){Object.assign(u,{name:ex.name,age:ex.age,from:ex.from,phone2:ex.phone2||'',car:ex.car,plate:ex.plate})}
else{
if(!S.tmp.photo){alert('Акси худро илова кунед');return}
if(!S.tmp.lic){alert('Акси шиносномаро илова кунед');return}
Object.assign(u,{age,from,phone2:p2?'+992'+p2:'',car,plate});
try{
await setDoc(doc(db,'drivers',p),{name:n,age,from,phone:u.phone,phone2:u.phone2,car,plate,photo:S.tmp.photo,verified:false,created:Date.now()});
await setDoc(doc(db,'licenses',p),{photo:S.tmp.lic,created:Date.now()}).catch(()=>{});
}catch(e){alert('Қайд нашуд. Интернет ва қоидаҳои базаро санҷед.');return}}}
S.user=u;save('user',u);S.tmp={};S.tab=u.role==='driver'?'post':'home';S.role=null;render()}
function logout(){stopShare();S.user=null;try{localStorage.removeItem('user')}catch(e){}render()}
function go(t){S.tab=t;render()}
function render(){
if(S.map){S.map.remove();S.map=null}
$('hd').className=S.tab==='home'?'':'bar';
$('app').innerHTML={home:home,map:mapView,post:post,me:me}[S.tab]();
document.querySelectorAll('nav button').forEach(b=>{b.className=b.dataset.t===S.tab?'on':''});
if(S.tab==='map')drawMap();
window.scrollTo(0,0)}
function refresh(){
if(S.tab==='home'){if($('f')){S.f=$('f').value;S.t=$('t').value}$('app').innerHTML=home()}
else if(S.tab==='post'&&$('mine')&&S.user)$('mine').innerHTML=mineHtml();
else if(S.tab==='map'){markers();const c=$('cnt');if(c)c.textContent=liveList().length}}
const ERR='Базаи маълумот пайваст нашуд. Қоидаҳои Firestore-ро санҷед.';
onSnapshot(collection(db,'trips'),s=>{S.trips=s.docs.map(d=>({...d.data(),id:d.id}));S.err='';S.loaded=true;refresh()},()=>{S.err=ERR;refresh()});
onSnapshot(collection(db,'drivers'),s=>{S.drivers={};s.docs.forEach(d=>{S.drivers[d.id]=d.data()});refresh()},()=>{});
onSnapshot(collection(db,'live'),s=>{S.live={};s.docs.forEach(d=>{S.live[d.id]=d.data()});refresh()},()=>{});
Object.assign(window,{go,quick,swap,search,addTrip,delTrip,pick,reg,logout,render,S,pickFile,startShare,stopShare,showOnMap});
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
render();
</script>
</body>
</html>
