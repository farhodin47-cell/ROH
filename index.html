<!doctype html>
<html lang="tg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Таксии байни ноҳияҳо</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0B4BD1">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--b:#0B4BD1;--y:#FFC21A;--ink:#0F1B3D;--mut:#5B6470;--bg:#F3F6FD;--line:#D5DCEA}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,Roboto,sans-serif;background:var(--bg);color:var(--ink);padding-bottom:84px}
header{position:relative;overflow:hidden;color:#fff;height:238px;background:linear-gradient(#0A3FBF,#2F6FE0 70%,#8DB6F2)}
header.bar{height:56px;background:var(--b)}
.hd{position:absolute;top:22px;left:18px;right:18px}
header.bar .hd{top:15px}
h1{margin:0;font-size:27px;line-height:1.1;font-weight:800}
h1 span{color:var(--y)}
header.bar h1{font-size:19px}
header.bar br,header.bar .tag,header.bar svg{display:none}
.tag{margin-top:8px;font-size:15px;font-style:italic}
header svg{position:absolute;left:0;bottom:0;width:100%;height:auto}
h2{font-size:17px;margin:20px 2px 10px}
main{padding:14px 14px 16px}
.card,.trip{background:#fff;border-radius:18px;padding:16px;margin-bottom:12px;box-shadow:0 1px 3px rgba(15,27,61,.08)}
.sc{margin-top:-38px;position:relative;box-shadow:0 4px 16px rgba(11,75,209,.16)}
label{display:block;font-size:13px;font-weight:600;color:var(--mut);margin:10px 0 4px}
select,input{width:100%;height:48px;border:1px solid var(--line);border-radius:12px;padding:0 12px;font-size:16px;background:#fff;color:var(--ink)}
button,.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:48px;margin-top:12px;border:0;border-radius:24px;background:var(--b);color:#fff;font-size:16px;font-weight:700;text-decoration:none;font-family:inherit}
button.ghost{background:#fff;color:var(--b);border:1.5px solid var(--b)}
button.big{background:#fff;color:var(--ink);border:2px solid var(--b);border-radius:20px;padding:18px;font-size:20px;flex-direction:column;gap:2px}
button.big.y{border-color:var(--y)}
button.big small{font-weight:400;color:var(--mut);font-size:14px}
.sr{display:flex;gap:8px;align-items:center}.sr .col{flex:1}
button.sw{width:46px;height:46px;min-height:0;margin:0;padding:0;border-radius:23px;background:#E3EBFB;flex:none}
.qs{display:grid;grid-template-columns:1fr 1fr;gap:8px}
button.q{margin:0;min-height:52px;border-radius:14px;background:#E3EBFB;color:var(--ink);border:1px solid #C9D6F3;font-size:14px;font-weight:600;padding:6px 10px}
.tt{display:flex;justify-content:space-between;align-items:flex-start}
.tm{font-size:28px;font-weight:800;line-height:1}
.dy{font-size:13px;color:var(--mut);margin-top:4px}
.pr{font-size:24px;font-weight:800;color:var(--b)}.pr small{font-size:13px;font-weight:600;color:var(--mut)}
.dr{display:flex;align-items:center;gap:12px;margin:14px 0 12px}
.av{width:42px;height:42px;border-radius:21px;background:var(--b);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:18px;flex:none}
.mut{color:var(--mut);font-size:14px}
.pl{display:inline-block;background:#FFF1CC;color:#6B4A00;border-radius:6px;padding:1px 7px;font-weight:700;font-size:13px}
.st{display:flex;align-items:center;gap:6px;font-size:14px;font-weight:600}
.st i{width:16px;height:16px;border-radius:5px;border:2px solid var(--b);display:inline-block}.st i.f{background:var(--b)}.st span{margin-left:6px}
.empty{text-align:center;padding:26px 10px;color:var(--mut)}
.empty b{display:block;color:var(--ink);font-size:17px;margin:10px 0 4px}
.badge{display:inline-block;border-radius:12px;padding:3px 10px;font-size:13px;font-weight:700;background:#E3EBFB;color:var(--b)}
.badge.y{background:#FFF1CC;color:#6B4A00}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:#fff;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav button{margin:0;border-radius:0;background:#fff;color:var(--mut);min-height:62px;flex-direction:column;gap:2px;font-size:12px;font-weight:600}
nav button.on{color:var(--b);box-shadow:inset 0 3px 0 var(--b)}
nav button svg{stroke:currentColor}
</style>
</head>
<body>
<header id="hd"><div class="hd"><h1>Таксии <br><span>байни ноҳияҳо</span></h1><div class="tag">Сафари осон, беҳтар ва зуд!</div></div><svg viewBox="0 0 390 120" aria-hidden="true"><polygon points="0,62 55,28 95,48 165,8 235,50 300,22 390,56 390,120 0,120" fill="#7C9BC9"/><polygon points="165,8 150,26 162,23 170,31 182,20" fill="#fff"/><polygon points="300,22 288,35 297,32 306,38" fill="#fff"/><path d="M0 70 Q95 52 195 72 T390 64 V120 H0Z" fill="#4F8F4D"/><polygon points="0,88 390,76 390,98 0,110" fill="#4A5160"/><line x1="0" y1="99" x2="390" y2="87" stroke="#FFC21A" stroke-width="2" stroke-dasharray="14 12"/><polygon points="0,110 390,98 390,120 0,120" fill="#3F7A40"/><rect x="246" y="66" width="124" height="22" rx="9" fill="#fff"/><path d="M268 66l15-16h42l16 16z" fill="#fff"/><path d="M277 65l11-11h34l11 11z" fill="#2B3A55"/><circle cx="276" cy="88" r="9" fill="#1B2230"/><circle cx="350" cy="88" r="9" fill="#1B2230"/></svg></header>
<main id="app"></main>
<nav><button data-t="home" onclick="go('home')"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" ><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>Асосӣ</button><button data-t="post" onclick="go('post')"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" ><path d="M12 5v14M5 12h14"/></svg>Эълон</button><button data-t="me" onclick="go('me')"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" ><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>Профил</button></nav>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import{getFirestore,collection,addDoc,deleteDoc,doc,onSnapshot}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const app=initializeApp({
apiKey:"AIzaSyBZUDW6O-VnJp5ZZJMbOJxGpYV0DB4NEkY",
authDomain:"taxi-roh.firebaseapp.com",
projectId:"taxi-roh",
storageBucket:"taxi-roh.firebasestorage.app",
messagingSenderId:"96810728626",
appId:"1:96810728626:web:eb5ba19098910216ea9dab"
});
const db=getFirestore(app);
const R={
"Душанбе":["Душанбе"],
"Вилояти Суғд":["Хуҷанд","Конибодом","Исфара","Истаравшан","Панҷакент","Истиқлол","Гулистон","Бустон","Мастчоҳ","Бобоҷон Ғафуров","Ашт","Зафаробод","Спитамен","Ҷаббор Расулов","Шаҳристон","Деваштич","Айнӣ","Кӯҳистони Мастчоҳ"],
"Вилояти Хатлон":["Бохтар","Кӯлоб","Норак","Левакант","Хуросон","Ёвон","Балҷувон","Ховалинг","Абдураҳмони Ҷомӣ","Данғара","Темурмалик","Мӯминобод","Кӯшониён","Вахш","Восеъ","Шамсиддин Шоҳин","Носири Хусрав","Шаҳритус","Қубодиён","Дӯстӣ","Ҷайҳун","Ҷалолиддин Балхӣ","Фархор","Панҷ","Ҳамадонӣ"],
"Кӯҳистони Бадахшон":["Хоруғ","Дарвоз","Ванҷ","Рӯшон","Шуғнон","Роштқалъа","Ишкошим","Мурғоб"],
"Ноҳияҳои тобеи ҷумҳурӣ":["Ҳисор","Турсунзода","Ваҳдат","Роғун","Шаҳринав","Варзоб","Рашт","Лахш","Рӯдакӣ","Файзобод","Нуробод","Тоҷикобод","Сангвор"]
};
const PH=`<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" stroke="#fff"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg>`,SWAP=`<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" stroke="#0B4BD1"><path d="M7 4v16M3 8l4-4 4 4M17 20V4M13 16l4 4 4-4"/></svg>`,CAR=`<svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" stroke="#9AA6C0"><path d="M5 17h14v-5l-2-5H7l-2 5zM3 12h18M7 17v2M17 17v2"/></svg>`;
function load(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}}
function save(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
const S={user:load('user'),trips:[],err:'',loaded:false,tab:'home',role:null,f:'Данғара',t:'Душанбе'};
function $(id){return document.getElementById(id)}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function fmt(p){const d=String(p||'').replace(/\D/g,'').replace(/^992/,'');return d.length===9?'+992 '+d.slice(0,2)+' '+d.slice(2,5)+' '+d.slice(5,7)+' '+d.slice(7):String(p||'')}
function opts(sel){let h='';for(const g in R){h+='<optgroup label="'+g+'">'+R[g].map(p=>'<option'+(p===sel?' selected':'')+'>'+p+'</option>').join('')+'</optgroup>'}return h}
function fresh(){return S.trips.filter(x=>Date.now()-(x.created||0)<129600000)}
function seats(n){n=Math.max(0,parseInt(n)||0);const t=Math.max(4,n);let h='';for(let i=0;i<t;i++)h+='<i class="'+(i<n?'f':'')+'"></i>';return h}
function card(x){return `<div class="trip"><div class="tt"><div><div class="tm">${esc(x.time)}</div><div class="dy">${esc(x.day)}</div></div><div class="pr">${esc(x.price)}<small> сомонӣ</small></div></div><div class="dr"><span class="av">${esc((x.name||'?').trim().charAt(0).toUpperCase())}</span><div><b>${esc(x.name)}</b><div class="mut">${esc(x.car)} · <span class="pl">${esc(x.plate)}</span></div></div></div><div class="st">${seats(x.seats)}<span>${esc(x.seats)} ҷои холӣ</span></div><a class="btn" href="tel:${esc(x.phone)}">${PH} Занг задан</a></div>`}
function empty(t,s){return `<div class="empty">${CAR}<b>${t}</b>${s}</div>`}
function home(){
const list=fresh().filter(x=>x.from===S.f&&x.to===S.t).sort((a,b)=>(a.day+a.time<b.day+b.time?-1:1));
const q=[['Душанбе','Хуҷанд'],['Хуҷанд','Душанбе'],['Душанбе','Бохтар'],['Бохтар','Душанбе'],['Данғара','Душанбе'],['Душанбе','Данғара']];
let body;
if(S.err)body=`<p class="mut">${S.err}</p>`;
else if(!S.loaded)body=empty('Боргирӣ…','');
else body=list.length?list.map(card).join(''):empty('Ҳоло мошин нест','Ронандагон дар бахши «Эълон» сафар илова мекунанд.');
return `<div class="card sc"><div class="sr"><div class="col"><label>Аз</label><select id="f">${opts(S.f)}</select><label>Ба</label><select id="t">${opts(S.t)}</select></div><button class="sw" aria-label="Иваз кардан" onclick="swap()">${SWAP}</button></div><button onclick="search()">Ҷустуҷӯ кардан</button></div><h2>Роҳҳои маъмул</h2><div class="qs">${q.map(p=>`<button class="q" onclick="quick('${p[0]}','${p[1]}')">${p[0]} → ${p[1]}</button>`).join('')}</div><h2>Мошинҳо: ${esc(S.f)} → ${esc(S.t)}</h2>`+body}
function quick(a,b){S.f=a;S.t=b;render()}
function search(){S.f=$('f').value;S.t=$('t').value;render()}
function swap(){const a=$('f').value,b=$('t').value;S.f=b;S.t=a;render()}
function mineHtml(){
const mine=fresh().filter(x=>x.phone===S.user.phone);
return mine.length?mine.map(x=>`<div class="trip"><div class="tt"><div><div class="tm" style="font-size:20px">${esc(x.from)} → ${esc(x.to)}</div><div class="dy">${esc(x.day)} · ${esc(x.time)} · ${esc(x.seats)} ҷои холӣ</div></div><div class="pr" style="font-size:20px">${esc(x.price)}</div></div><button class="ghost" onclick="delTrip('${x.id}')">Мошин пур шуд / Бекор кардан</button></div>`).join(''):empty('Эълон нест','Сафари нав илова кунед.')}
function post(){
if(!S.user||S.user.role!=='driver')return `<div class="card"><h2 style="margin-top:0">Эълони сафар</h2><p class="mut">Барои эълон кардани сафар аввал ҳамчун ронанда қайд шавед.</p><button onclick="go('me')">Қайд шудан</button></div>`;
return `<div class="card"><h2 style="margin-top:0">Сафари нав</h2><label>Аз</label><select id="pf">${opts('Данғара')}</select><label>Ба</label><select id="pt">${opts('Душанбе')}</select><label>Рӯз</label><select id="pd"><option>Имрӯз</option><option>Фардо</option></select><label>Вақти ҳаракат</label><input id="pm" type="time"><label>Ҷойҳои холӣ</label><input id="ps" type="number" min="1" max="8" value="3"><label>Нарх (сомонӣ)</label><input id="pp" type="number" min="0"><button onclick="addTrip()">Эълон кардан</button></div><h2>Эълонҳои ман</h2><div id="mine">${mineHtml()}</div>`}
async function addTrip(){
const m=$('pm').value,p=$('pp').value,a=$('pf').value,b=$('pt').value;
if(!m||!p){alert('Вақт ва нархро нависед');return}
if(a===b){alert('Самти «аз» ва «ба» набояд яксон бошад');return}
try{await addDoc(collection(db,'trips'),{from:a,to:b,day:$('pd').value,time:m,seats:$('ps').value,price:p,name:S.user.name,car:S.user.car,plate:S.user.plate,phone:S.user.phone,created:Date.now()});$('pm').value='';$('pp').value=''}catch(e){alert('Эълон нашуд. Интернет ва қоидаҳои базаро санҷед.')}}
async function delTrip(id){try{await deleteDoc(doc(db,'trips',id))}catch(e){alert('Нашуд. Боз кӯшиш кунед.')}}
function me(){
if(S.user){const u=S.user,d=u.role==='driver';return `<div class="card"><div class="dr" style="margin-top:0"><span class="av" style="width:56px;height:56px;border-radius:28px;font-size:24px">${esc((u.name||'?').trim().charAt(0).toUpperCase())}</span><div><b style="font-size:19px">${esc(u.name)}</b><div style="margin-top:4px"><span class="badge${d?' y':''}">${d?'Ронанда':'Муштарӣ'}</span></div></div></div><div class="mut">Телефон</div><div style="font-size:17px;font-weight:600;margin-bottom:10px">${esc(fmt(u.phone))}</div>${d?`<div class="mut">Мошин</div><div style="font-size:17px;font-weight:600">${esc(u.car)} <span class="pl">${esc(u.plate)}</span></div>`:''}<button class="ghost" onclick="logout()">Баромадан</button></div>`}
if(!S.role)return `<h2 style="margin-top:0">Шумо кистед?</h2><button class="big" onclick="pick('customer')">Муштарӣ<small>Ман такси мехоҳам</small></button><button class="big y" onclick="pick('driver')">Ронанда (такси)<small>Ман мусофир мебарам</small></button>`;
const d=S.role==='driver';
return `<div class="card"><h2 style="margin-top:0">${d?'Қайди ронанда':'Қайди муштарӣ'}</h2><label>Ном ва насаб</label><input id="rn"><label>Рақами телефон (+992)</label><input id="rp" type="tel" inputmode="numeric" placeholder="92 123 45 67">${d?`<label>Мошин (марка)</label><input id="rc"><label>Рақами давлатии мошин</label><input id="rl">`:''}<button onclick="reg()">Қайд шудан</button><p class="mut">Тасдиқи рамзи СМС баъдтар илова мешавад.</p><button class="ghost" onclick="pick(null)">Бозгашт</button></div>`}
function pick(r){S.role=r;render()}
function reg(){
const n=$('rn').value.trim();let p=$('rp').value.replace(/\D/g,'').replace(/^992/,'').replace(/^0+/,'');
if(!n||p.length!==9){alert('Ном ва рақами телефонро дуруст нависед: 9 рақам, масалан 921234567');return}
const u={role:S.role,name:n,phone:'+992'+p};
if(S.role==='driver'){u.car=$('rc').value.trim();u.plate=$('rl').value.trim();if(!u.car||!u.plate){alert('Мошин ва рақамро нависед');return}}
S.user=u;save('user',u);S.tab=u.role==='driver'?'post':'home';S.role=null;render()}
function logout(){S.user=null;try{localStorage.removeItem('user')}catch(e){}render()}
function go(t){S.tab=t;render()}
function render(){
$('hd').className=S.tab==='home'?'':'bar';
$('app').innerHTML={home:home,post:post,me:me}[S.tab]();
document.querySelectorAll('nav button').forEach(b=>{b.className=b.dataset.t===S.tab?'on':''});
window.scrollTo(0,0)}
function refresh(){
if(S.tab==='home'){if($('f')){S.f=$('f').value;S.t=$('t').value}$('app').innerHTML=home()}
else if(S.tab==='post'&&$('mine')&&S.user)$('mine').innerHTML=mineHtml()}
onSnapshot(collection(db,'trips'),snap=>{S.trips=snap.docs.map(d=>({...d.data(),id:d.id}));S.err='';S.loaded=true;refresh()},e=>{S.err='Базаи маълумот пайваст нашуд. Қоидаҳои Firestore-ро санҷед.';refresh()});
Object.assign(window,{go,quick,swap,search,addTrip,delTrip,pick,reg,logout,render,S});
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
render();
</script>
</body>
</html>
