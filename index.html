<!doctype html>
<html lang="tg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Таксии байни ноҳияҳо</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0B4BD1">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
*{box-sizing:border-box}
body{margin:0;font-family:sans-serif;background:#F3F6FD;color:#0F1B3D;padding-bottom:72px}
header{position:relative;height:258px;overflow:hidden;color:#fff;background:linear-gradient(#0A3FBF,#2F6FE0 60%,#8DB6F2)}
.hd{position:absolute;top:26px;left:18px;right:18px}
h1{margin:0;font-size:28px;line-height:1.1}
h1 span{color:#FFC21A}
.tag{margin-top:8px;font-size:15px;font-style:italic}
header svg{position:absolute;left:0;bottom:0}
h2{font-size:18px;margin:16px 0 8px}
main{padding:0 14px 16px}.sc{margin-top:-18px;position:relative;box-shadow:0 2px 12px rgba(11,75,209,.15)}.sr{display:flex;gap:8px;align-items:center}.sr .col{flex:1}button.sw{width:46px;height:46px;min-height:0;margin:0;padding:0;border-radius:23px;background:#E3EBFB;line-height:normal;display:flex;align-items:center;justify-content:center}.qs{display:grid;grid-template-columns:1fr 1fr;gap:8px}button.q{margin:0;min-height:52px;border-radius:14px;background:#E3EBFB;color:#0F1B3D;border:1px solid #C9D6F3;font-size:14px;line-height:1.2;padding:6px 10px}
.card,.trip{background:#fff;border-radius:16px;padding:16px;margin-bottom:12px}
label{display:block;font-size:13px;font-weight:bold;margin:10px 0 4px}
select,input{width:100%;height:48px;border:1px solid #C9D2E6;border-radius:12px;padding:0 12px;font-size:16px;background:#fff}
button,.btn{display:block;width:100%;min-height:48px;margin-top:12px;border:0;border-radius:24px;background:#0B4BD1;color:#fff;font-size:16px;font-weight:bold;text-align:center;line-height:48px;text-decoration:none}
button.ghost{background:#fff;color:#0B4BD1;border:1px solid #0B4BD1;line-height:normal}
button.big{background:#fff;color:#0F1B3D;border:2px solid #0B4BD1;border-radius:20px;padding:18px;line-height:1.3;font-size:20px}
button.big.y{border-color:#FFC21A}
button.big small{font-weight:normal;color:#5B6470;font-size:14px}
.row{display:flex;justify-content:space-between;font-size:18px;margin-bottom:4px}
.mut{color:#5B6470;font-size:14px}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:#fff;border-top:1px solid #D5DCEA}
nav button{margin:0;border-radius:0;background:#fff;color:#5B6470;line-height:normal;min-height:60px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12px}nav button svg{stroke:currentColor}
nav button.on{color:#0B4BD1;border-top:3px solid #0B4BD1}
</style>
</head>
<body>
<header><div class="hd"><h1>Таксии<br><span>байни ноҳияҳо</span></h1><div class="tag">Сафари осон, беҳтар ва зуд!</div></div>
<svg width="100%" height="120" viewBox="0 0 390 120" preserveAspectRatio="xMidYMax slice" aria-hidden="true"><polygon points="0,70 60,25 100,48 170,5 240,52 300,18 390,58 390,120 0,120" fill="#7C9BC9"/><polygon points="170,5 152,26 166,22 176,32 190,20" fill="#fff"/><polygon points="300,18 286,34 298,30 308,38" fill="#fff"/><path d="M0 84 Q90 62 190 86 T390 76 V120 H0Z" fill="#4F8F4D"/><polygon points="0,120 0,108 390,92 390,120" fill="#4A5160"/><line x1="0" y1="114" x2="390" y2="102" stroke="#FFC21A" stroke-width="2" stroke-dasharray="14 12"/><rect x="250" y="76" width="132" height="26" rx="10" fill="#fff"/><path d="M276 76l16-17h46l18 17z" fill="#fff"/><path d="M286 74l12-12h38l12 12z" fill="#2B3A55"/><circle cx="280" cy="102" r="10" fill="#1B2230"/><circle cx="352" cy="102" r="10" fill="#1B2230"/></svg></header>
<main id="app"></main>
<nav>
<button data-t="home" onclick="go('home')"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>Асосӣ</button>
<button data-t="post" onclick="go('post')"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>Эълон</button>
<button data-t="me" onclick="go('me')"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>Профил</button>
</nav>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import{getFirestore,collection,addDoc,deleteDoc,doc,onSnapshot}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const app=initializeApp({
apiKey:"AIzaSyBZUDW6O-VnJp5ZZJMbOJxGpYV0DB4NEkY",
authDomain:"taxi-roh.firebaseapp.com",
projectId:"taxi-roh",
storageBucket:"taxi-roh.firebasestorage.app",
messagingSenderId:"96810728626",
appId:"1:96810728626:web:eb5ba19098910216ea9dab"
});
const db=getFirestore(app);
const R={
"Душанбе":["Душанбе"],
"Вилояти Суғд":["Хуҷанд","Конибодом","Исфара","Истаравшан","Панҷакент","Истиқлол","Гулистон","Бустон","Мастчоҳ","Бобоҷон Ғафуров","Ашт","Зафаробод","Спитамен","Ҷаббор Расулов","Шаҳристон","Деваштич","Айнӣ","Кӯҳистони Мастчоҳ"],
"Вилояти Хатлон":["Бохтар","Кӯлоб","Норак","Левакант","Хуросон","Ёвон","Балҷувон","Ховалинг","Абдураҳмони Ҷомӣ","Данғара","Темурмалик","Мӯминобод","Кӯшониён","Вахш","Восеъ","Шамсиддин Шоҳин","Носири Хусрав","Шаҳритус","Қубодиён","Дӯстӣ","Ҷайҳун","Ҷалолиддин Балхӣ","Фархор","Панҷ","Ҳамадонӣ"],
"Кӯҳистони Бадахшон":["Хоруғ","Дарвоз","Ванҷ","Рӯшон","Шуғнон","Роштқалъа","Ишкошим","Мурғоб"],
"Ноҳияҳои тобеи ҷумҳурӣ":["Ҳисор","Турсунзода","Ваҳдат","Роғун","Шаҳринав","Варзоб","Рашт","Лахш","Рӯдакӣ","Файзобод","Нуробод","Тоҷикобод","Сангвор"]
};
function load(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}}
function save(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
const S={user:load('user'),trips:[],err:'',tab:'home',role:null,f:'Данғара',t:'Душанбе'};
function $(id){return document.getElementById(id)}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function opts(sel){let h='';for(const g in R){h+='<optgroup label="'+g+'">'+R[g].map(p=>'<option'+(p===sel?' selected':'')+'>'+p+'</option>').join('')+'</optgroup>'}return h}
function fresh(){return S.trips.filter(x=>Date.now()-(x.created||0)<129600000)}
function card(x){return `<div class="trip"><div class="row"><b>${esc(x.day)} ${esc(x.time)}</b><b>${esc(x.price)} сомонӣ</b></div><div class="mut">${esc(x.name)} · ${esc(x.car)} ${esc(x.plate)}</div><div>${esc(x.seats)} ҷои холӣ</div><a class="btn" href="tel:${esc(x.phone)}">Занг задан</a></div>`}
function home(){
const list=fresh().filter(x=>x.from===S.f&&x.to===S.t).sort((a,b)=>(a.day+a.time<b.day+b.time?-1:1));
const q=[['Душанбе','Хуҷанд'],['Хуҷанд','Душанбе'],['Душанбе','Бохтар'],['Бохтар','Душанбе'],['Данғара','Душанбе'],['Душанбе','Данғара']];
return `<div class="card sc"><div class="sr"><div class="col"><label>Аз</label><select id="f">${opts(S.f)}</select><label>Ба</label><select id="t">${opts(S.t)}</select></div><button class="sw" aria-label="Иваз кардан" onclick="swap()"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#0B4BD1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 4v16M3 8l4-4 4 4M17 20V4M13 16l4 4 4-4"/></svg></button></div><button onclick="search()">Ҷустуҷӯ кардан</button></div><h2>Роҳҳои маъмул</h2><div class="qs">${q.map(p=>`<button class="q" onclick="quick('${p[0]}','${p[1]}')">${p[0]} → ${p[1]}</button>`).join('')}</div><h2>Мошинҳо: ${esc(S.f)} → ${esc(S.t)}</h2>`+(S.err?`<p class="mut">${S.err}</p>`:'')+(list.length?list.map(card).join(''):'<p class="mut">Ҳоло мошин нест. Ронандагон дар бахши «Эълон» сафар илова мекунанд.</p>')}
function search(){S.f=$('f').value;S.t=$('t').value;render()}
function quick(a,b){S.f=a;S.t=b;render()}
function swap(){const a=$('f').value,b=$('t').value;S.f=b;S.t=a;render()}
function mineHtml(){
const mine=fresh().filter(x=>x.phone===S.user.phone);
return mine.length?mine.map(x=>`<div class="trip"><div class="row"><b>${esc(x.from)} → ${esc(x.to)}</b><span>${esc(x.day)} ${esc(x.time)}</span></div><button class="ghost" onclick="delTrip('${x.id}')">Мошин пур шуд / Бекор кардан</button></div>`).join(''):'<p class="mut">Ҳоло эълон нест.</p>'}
function post(){
if(!S.user||S.user.role!=='driver')return `<div class="card"><p>Барои эълон кардани сафар аввал ҳамчун ронанда қайд шавед.</p><button onclick="go('me')">Қайд шудан</button></div>`;
return `<div class="card"><label>Аз</label><select id="pf">${opts('Данғара')}</select><label>Ба</label><select id="pt">${opts('Душанбе')}</select><label>Рӯз</label><select id="pd"><option>Имрӯз</option><option>Фардо</option></select><label>Вақти ҳаракат</label><input id="pm" type="time"><label>Ҷойҳои холӣ</label><input id="ps" type="number" min="1" max="8" value="3"><label>Нарх (сомонӣ)</label><input id="pp" type="number" min="0"><button onclick="addTrip()">Эълон кардан</button></div><h2>Эълонҳои ман</h2><div id="mine">${mineHtml()}</div>`}
async function addTrip(){
const m=$('pm').value,p=$('pp').value,a=$('pf').value,b=$('pt').value;
if(!m||!p){alert('Вақт ва нархро нависед');return}
if(a===b){alert('Самти «аз» ва «ба» набояд яксон бошад');return}
try{await addDoc(collection(db,'trips'),{from:a,to:b,day:$('pd').value,time:m,seats:$('ps').value,price:p,name:S.user.name,car:S.user.car,plate:S.user.plate,phone:S.user.phone,created:Date.now()});$('pm').value='';$('pp').value=''}catch(e){alert('Эълон нашуд. Интернет ва қоидаҳои базаро санҷед.')}}
async function delTrip(id){try{await deleteDoc(doc(db,'trips',id))}catch(e){alert('Нашуд. Боз кӯшиш кунед.')}}
function me(){
if(S.user){const u=S.user;return `<div class="card"><h2>${esc(u.name)}</h2><p>${u.role==='driver'?'Ронанда':'Муштарӣ'} · ${esc(u.phone)}</p>${u.role==='driver'?`<p class="mut">${esc(u.car)} · ${esc(u.plate)}</p>`:''}<button class="ghost" onclick="logout()">Баромадан</button></div>`}
if(!S.role)return `<h2>Шумо кистед?</h2><button class="big" onclick="pick('customer')">Муштарӣ<br><small>Ман такси мехоҳам</small></button><button class="big y" onclick="pick('driver')">Ронанда (такси)<br><small>Ман мусофир мебарам</small></button>`;
const d=S.role==='driver';
return `<div class="card"><h2>${d?'Қайди ронанда':'Қайди муштарӣ'}</h2><label>Ном ва насаб</label><input id="rn"><label>Рақами телефон (+992)</label><input id="rp" type="tel" placeholder="9XXXXXXXX">${d?`<label>Мошин (марка)</label><input id="rc"><label>Рақами давлатии мошин</label><input id="rl">`:''}<button onclick="reg()">Қайд шудан</button><p class="mut">Тасдиқи рамзи СМС баъдтар илова мешавад.</p><button class="ghost" onclick="pick(null)">Бозгашт</button></div>`}
function pick(r){S.role=r;render()}
function reg(){
const n=$('rn').value.trim(),p=$('rp').value.replace(/\D/g,'').replace(/^992/,'');
if(!n||p.length!==9){alert('Ном ва рақами 9-рақамаро дуруст нависед');return}
const u={role:S.role,name:n,phone:'+992'+p};
if(S.role==='driver'){u.car=$('rc').value.trim();u.plate=$('rl').value.trim();if(!u.car||!u.plate){alert('Мошин ва рақамро нависед');return}}
S.user=u;save('user',u);S.tab=u.role==='driver'?'post':'home';S.role=null;render()}
function logout(){S.user=null;try{localStorage.removeItem('user')}catch(e){}render()}
function go(t){S.tab=t;render()}
function render(){
$('app').innerHTML={home:home,post:post,me:me}[S.tab]();
document.querySelectorAll('nav button').forEach(b=>{b.className=b.dataset.t===S.tab?'on':''});
window.scrollTo(0,0)}
function refresh(){
if(S.tab==='home'){if($('f')){S.f=$('f').value;S.t=$('t').value}$('app').innerHTML=home()}
else if(S.tab==='post'&&$('mine')&&S.user)$('mine').innerHTML=mineHtml()}
onSnapshot(collection(db,'trips'),snap=>{S.trips=snap.docs.map(d=>({...d.data(),id:d.id}));S.err='';refresh()},e=>{S.err='Базаи маълумот пайваст нашуд. Қоидаҳои Firestore-ро санҷед.';refresh()});
Object.assign(window,{go,quick,swap,search,addTrip,delTrip,pick,reg,logout});
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
render();
</script>
</body>
</html>
